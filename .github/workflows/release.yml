name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Build self-contained packages for every supported platform.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
          - rid: osx-x64
            os: macos-latest
          - rid: osx-arm64
            os: macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Publish (self-contained, ${{ matrix.rid }})
        shell: bash
        run: |
          dotnet publish UsbDaq.App/UsbDaq.App.csproj \
            --configuration Release \
            --runtime ${{ matrix.rid }} \
            --self-contained true \
            -p:Version=${{ steps.version.outputs.VERSION }} \
            --output publish/app

      - name: Package (zip)
        shell: bash
        run: |
          ver="${{ steps.version.outputs.VERSION }}"
          pkg="USB-DAQ-v${ver}-${{ matrix.rid }}"
          mkdir -p "$pkg/app"
          cp -r publish/app/. "$pkg/app/"
          if [ "${{ matrix.rid }}" = "win-x64" ]; then
            cp installer/Install-UsbDaq.ps1   "$pkg/"
            cp installer/Uninstall-UsbDaq.ps1 "$pkg/"
            cp installer/README-INSTALLER.md  "$pkg/"
          fi
          if [ "${{ runner.os }}" = "Windows" ]; then
            powershell -Command "Compress-Archive -Path '$pkg' -DestinationPath '${pkg}.zip'"
          else
            zip -r "${pkg}.zip" "$pkg"
          fi
          echo "Created ${pkg}.zip"

      - name: Build one-click installer (Inno Setup)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.VERSION }}"
          # Inno Setup ships preinstalled on the windows-latest runner
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc "/DMyAppVersion=$ver" installer/UsbDaq.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compile failed" }

          # Constant filename so the landing page can always link to the latest installer
          Move-Item "installer/Output/USB-DAQ-Setup.exe" "USB-DAQ-Setup.exe" -Force
          Write-Host "Created USB-DAQ-Setup.exe"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.rid }}
          path: |
            USB-DAQ-v${{ steps.version.outputs.VERSION }}-${{ matrix.rid }}.zip
            USB-DAQ-Setup.exe
          if-no-files-found: ignore

  # Collect every platform package into a single GitHub Release.
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "USB DAQ v${{ steps.version.outputs.VERSION }}"
          files: |
            dist/USB-DAQ-Setup.exe
            dist/USB-DAQ-v${{ steps.version.outputs.VERSION }}-win-x64.zip
            dist/USB-DAQ-v${{ steps.version.outputs.VERSION }}-linux-x64.zip
            dist/USB-DAQ-v${{ steps.version.outputs.VERSION }}-osx-x64.zip
            dist/USB-DAQ-v${{ steps.version.outputs.VERSION }}-osx-arm64.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
