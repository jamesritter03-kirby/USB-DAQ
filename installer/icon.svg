<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="USB DAQ icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2c49"/>
      <stop offset="0.55" stop-color="#111a28"/>
      <stop offset="1" stop-color="#0a0e15"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2bd9a8"/>
      <stop offset="1" stop-color="#3ea6ff"/>
    </linearGradient>
    <linearGradient id="plug" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3ea6ff"/>
      <stop offset="1" stop-color="#2bd9a8"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="tile">
      <rect x="16" y="16" width="480" height="480" rx="112"/>
    </clipPath>
  </defs>

  <!-- App tile -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16.5" y="16.5" width="479" height="479" rx="111.5" fill="none" stroke="#3ea6ff" stroke-opacity="0.18" stroke-width="3"/>

  <g clip-path="url(#tile)">
    <!-- Oscilloscope baseline + grid hints -->
    <line x1="72" y1="256" x2="440" y2="256" stroke="#3ea6ff" stroke-opacity="0.12" stroke-width="4" stroke-dasharray="2 14" stroke-linecap="round"/>
    <line x1="256" y1="120" x2="256" y2="392" stroke="#3ea6ff" stroke-opacity="0.06" stroke-width="4" stroke-dasharray="2 14" stroke-linecap="round"/>

    <!-- USB plug feeding the signal -->
    <g>
      <rect x="60" y="236" width="40" height="40" rx="12" fill="url(#plug)"/>
      <rect x="96" y="216" width="86" height="80" rx="16" fill="url(#plug)"/>
      <rect x="120" y="238" width="18" height="14" rx="3" fill="#0a0e15" fill-opacity="0.85"/>
      <rect x="120" y="260" width="18" height="14" rx="3" fill="#0a0e15" fill-opacity="0.85"/>
      <rect x="150" y="238" width="18" height="36" rx="4" fill="#0a0e15" fill-opacity="0.85"/>
    </g>

    <!-- Acquired waveform -->
    <path d="M182 256 H214 L240 200 L264 314 L292 128 L322 344 L350 222 L380 256 H452"
          fill="none" stroke="url(#wave)" stroke-width="17"
          stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

    <!-- Peak sample node -->
    <circle cx="292" cy="128" r="15" fill="#eafcff"/>
    <circle cx="292" cy="128" r="15" fill="none" stroke="#2bd9a8" stroke-width="6"/>
  </g>
</svg>
